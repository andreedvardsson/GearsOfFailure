name: Docker CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install -r simple-app/python-app/requirements.txt

    - name: Run tests
      run: pytest simple-app/python-app/tests -v

    - name: Build Docker image
      run: docker build -t gears-of-failure:${{ github.sha }} .

    - name: List Docker images
      run: docker images

    - name: Health check
      run: |
        docker run -d --name test-container -p 3000:3000 gears-of-failure:${{ github.sha }}
        sleep 10
        docker ps -a
        docker logs test-container
        curl -f http://localhost:3000/api/health || exit 1
        docker stop test-container
        docker rm test-container

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag image for Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag gears-of-failure:${{ github.sha }} andreedvardsson/gearsoffailure:${{ github.sha }}
        docker tag gears-of-failure:${{ github.sha }} andreedvardsson/gearsoffailure:latest

    - name: Push to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push andreedvardsson/gearsoffailure:${{ github.sha }}
        docker push andreedvardsson/gearsoffailure:latest
