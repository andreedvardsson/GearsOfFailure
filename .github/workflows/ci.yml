name: Docker CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run Tic-Tac-Toe API tests
      run: python -m unittest discover -s simple-app/python-app/tests -p "test_*.py" -v

    - name: Build Docker image
      run: docker build -t gears-of-failure:${{ github.sha }} .

    - name: List Docker images
      run: docker images

    - name: Test Docker image runs
      run: |
        docker run -d --name test-container -p 3000:3000 gears-of-failure:${{ github.sha }}
        sleep 5
        docker ps -a
        docker logs test-container
        if ! docker ps --format '{{.Names}}' | grep -q '^test-container$'; then
          echo "Container did not stay running"
          exit 1
        fi
        docker stop test-container
        docker rm test-container
